services:
  - type: web
    name: catalyst-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: catalyst-db
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # You'll paste this in the Render dashboard
      - key: DB_PATH
        value: /data/catalyst.db
      - key: PYTHON_VERSION
        value: 3.11.0
